# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

# Authors and maintainers use the {name, orcid} form that Palomar's submission profile accepts.
# The upstream v0.4 schema takes plain name strings, so a strict check against it reports those
# two entries; everything else validates.

project:
  name: "fc-poisson-2"
  description: >-
    A machine-checked proof that the Poisson conjecture fails for two canonical pairs, and hence
    for every n >= 2, following the explicit counterexample of C. D. Long (2026). The statements
    and definitions are Formal Conjectures' (PoissonConjecture.lean, arXiv math/0608009), copied
    verbatim into Challenge.lean, so this entry proves Formal Conjectures' own statements.
  authors:
    - name: "Zayn Blore"
      orcid: "0009-0009-8447-7247"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Zayn Blore"
      orcid: "0009-0009-8447-7247"

sources:
  - title: "An Explicit Counterexample to the Rank-Two Poisson Conjecture"
    authors:
      - "Christopher D. Long"
    id: "https://arxiv.org/abs/2608.23777"
    type: "preprint"
    location: "Sections 3-8: Theorem 1.1 (the non-automorphism part, from the two points of Proposition 7.2), Theorem 5.2, Proposition 6.2, Corollary 8.1 (proved here by a retraction, not Long's irreducibility argument)"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/a6bf2bb646fc1926130c24781a3b3cf23d0ef288/FormalConjectures/Arxiv/math.0608009/PoissonConjecture.lean"
    relationship: "builds-on"
    note: >-
      Supplies the statements `poisson_conjecture`, `poisson_conjecture.variants.dimension_two`,
      `poisson_conjecture.variants.dimension_three` and
      `poisson_conjecture.variants.dimension_ge_two`, and the three definitions they use
      (`MvPolynomial.poissonBracket` comes from
      FormalConjecturesForMathlib/Algebra/MvPolynomial/PoissonBracket.lean). Challenge.lean and
      Poisson2/Defs.lean copy the definitions verbatim, with their names, and Challenge.lean
      copies the statements; scripts/check-fc-match.py checks this against Formal Conjectures at
      that commit. Palomar does not accept escaped name components such as «math.0608009» in
      theorem names, so Challenge.lean states the four theorems in the namespace
      PoissonConjecture, with Formal Conjectures' leaf names (for example
      PoissonConjecture.poisson_conjecture.variants.dimension_two); Solution proves them under
      both these names and Formal Conjectures' own. The basic bracket lemmas in
      Poisson2/Bracket.lean are copied from the same file, with one deprecated lemma name
      replaced. An earlier version of this repository
      (commit d464ff4) depended on Formal Conjectures directly and was linked from Formal
      Conjectures PR #7657.

classification:
  arxiv:
    - "math.RA"
  msc2020:
    - "17B63"
    - "14R15"

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
      framework: "Claude Code"
  notes: >-
    I drafted the Lean with Claude Code, following Long's paper, and ported it to Lean
    v4.35.0-rc3 and Palomar's layout with Claude Code.

review:
  status: "agent-reviewed"
  reviewers:
    - "Zayn Blore"
  notes: >-
    Checked locally (Windows): the build, including four `example`s in
    Poisson2/FormalTarget.lean that check that Formal Conjectures' names and the PoissonConjecture
    names have the same statements at every universe level; scripts/check-fc-match.py and its
    self-test, which check that Challenge.lean is Formal Conjectures' three definitions and four
    statements, character for character, and nothing else; `audit/Axioms.lean`, which enforces with
    `#guard_msgs` that the four theorems use only propext, Classical.choice and Quot.sound; and
    `audit/Control.lean`, which checks that the audit detects `sorryAx`, specialises the result
    to the rationals, and checks the bracket sign and Long's common image. `lake comparator`
    needs Linux, so it runs in CI and in Palomar's own pipeline; Palomar's preflight passed on
    commit 4d85fa8, which differs from this version only in these metadata, the README, the
    fidelity script and the four `example`s. Seven AI-model reviews commissioned by the author,
    none published, found no soundness problem. Two (OpenAI Astra and Claude Fable 5.1, 30
    October 2026) reviewed commit 4d85fa8, after Challenge.lean's theorems moved to the namespace
    PoissonConjecture; this version applies their recommendations (the `example`s, the
    FormalTarget checks in the fidelity script, and wording). Two more (the same models, earlier
    on 30 October) reviewed the port before that move. Each of these four ran Comparator's
    comparison and axiom check on kernel exports of Challenge and Solution, and Lean's kernel,
    nanoda and con-ron on the Solution export; all passed. Three earlier reviews (OpenAI Astra,
    Claude Opus 5.5 and Claude Fable 5.1, October 2026) reviewed the earlier version, whose proofs
    this version keeps: the port changed module headers and imports, deprecated lemma names, one
    simp set and one rewrite step, and restated Poisson2/FormalTarget.lean under Formal
    Conjectures' names. A Lean proof over the
    rationals was reported in Formal Conjectures PR #5451; the PR neither includes nor links
    it, and I could not find it.

status:
  scope: >-
    Full proofs of four Formal Conjectures statements: the Poisson conjecture fails for two
    canonical pairs, for three, and for every n >= 2, so it is false. The case of one pair
    (Formal Conjectures' dimension_one) is open and not covered. Apart from the four placeholders
    in Challenge.lean, the only sorry is a deliberate control in audit/Control.lean, which
    Solution does not import.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - description: >-
        The Poisson conjecture fails for two canonical pairs. Also proved as
        PoissonConjecture.poisson_conjecture.variants.dimension_two, the name Palomar checks.
      declaration: "Arxiv.«math.0608009».poisson_conjecture.variants.dimension_two"
      file: "Poisson2/FormalTarget.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
    - description: >-
        The Poisson conjecture fails for three canonical pairs (the case n = 3). Also proved as
        PoissonConjecture.poisson_conjecture.variants.dimension_three, the name Palomar checks.
      declaration: "Arxiv.«math.0608009».poisson_conjecture.variants.dimension_three"
      file: "Poisson2/FormalTarget.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
    - description: >-
        The Poisson conjecture fails for every n >= 2. Also proved as
        PoissonConjecture.poisson_conjecture.variants.dimension_ge_two, the name Palomar checks.
      declaration: "Arxiv.«math.0608009».poisson_conjecture.variants.dimension_ge_two"
      file: "Poisson2/FormalTarget.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
    - description: >-
        The Poisson conjecture is false. Also proved as PoissonConjecture.poisson_conjecture, the
        name Palomar checks.
      declaration: "Arxiv.«math.0608009».poisson_conjecture"
      file: "Poisson2/FormalTarget.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
    - description: "The chain rule for partial derivatives of a substitution."
      declaration: "Poisson2.pderiv_aeval"
      file: "Poisson2/ChainRule.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"

fidelity:
  divergences: >-
    None in the statements, which are Formal Conjectures' own, copied verbatim. Formal
    Conjectures' bracket has {X_i, X_(i+n)} = 1, the opposite sign to Long's {p, x} = 1; with
    x, q, p, z = X_1, X_2, X_3, X_4 the map X_1, X_2, X_3, X_4 -> R, T, D, S is a Poisson
    endomorphism for Formal Conjectures' bracket, as its docstring states. The six identities
    are proved in Long's source coordinates (x, y, beta, D_0); the change to those coordinates
    is not itself formalised as an automorphism, because the proof does not need it. Of Long's
    Theorem 1.1 only the non-automorphism is formalised, using two points of his fibre; the
    determinant-one claim and the exactness of the three-point fibre are not.

alignment:
  namespaces:
    - "Arxiv.«math.0608009»"
    - "PoissonConjecture"
    - "Poisson2"
  statements:
    - source: "Formal Conjectures, poisson_conjecture.variants.dimension_two"
      lean: "Arxiv.«math.0608009».poisson_conjecture.variants.dimension_two"
      module: "Poisson2.FormalTarget"
      status: "proved"
      note: "Formal Conjectures' own name."
    - source: "Formal Conjectures, poisson_conjecture.variants.dimension_three"
      lean: "Arxiv.«math.0608009».poisson_conjecture.variants.dimension_three"
      module: "Poisson2.FormalTarget"
      status: "proved"
      note: "Formal Conjectures' own name."
    - source: "Formal Conjectures, poisson_conjecture.variants.dimension_ge_two"
      lean: "Arxiv.«math.0608009».poisson_conjecture.variants.dimension_ge_two"
      module: "Poisson2.FormalTarget"
      status: "proved"
      note: "Formal Conjectures' own name."
    - source: "Formal Conjectures, poisson_conjecture"
      lean: "Arxiv.«math.0608009».poisson_conjecture"
      module: "Poisson2.FormalTarget"
      status: "proved"
      note: "Formal Conjectures' own name."
    - source: "Formal Conjectures, poisson_conjecture.variants.dimension_two"
      lean: "PoissonConjecture.poisson_conjecture.variants.dimension_two"
      module: "Poisson2.FormalTarget"
      status: "proved"
      note: >-
        The name in comparator.json and Challenge.lean; same statement as Formal Conjectures'
        name, checked in Lean at every universe level.
    - source: "Formal Conjectures, poisson_conjecture.variants.dimension_three"
      lean: "PoissonConjecture.poisson_conjecture.variants.dimension_three"
      module: "Poisson2.FormalTarget"
      status: "proved"
      note: >-
        The name in comparator.json and Challenge.lean; same statement as Formal Conjectures'
        name, checked in Lean at every universe level.
    - source: "Formal Conjectures, poisson_conjecture.variants.dimension_ge_two"
      lean: "PoissonConjecture.poisson_conjecture.variants.dimension_ge_two"
      module: "Poisson2.FormalTarget"
      status: "proved"
      note: >-
        The name in comparator.json and Challenge.lean; same statement as Formal Conjectures'
        name, checked in Lean at every universe level.
    - source: "Formal Conjectures, poisson_conjecture"
      lean: "PoissonConjecture.poisson_conjecture"
      module: "Poisson2.FormalTarget"
      status: "proved"
      note: >-
        The name in comparator.json and Challenge.lean; same statement as Formal Conjectures'
        name, checked in Lean at every universe level.
    - source: "Long (2026), Corollary 8.1"
      lean: "Poisson2.dimension_ge_two"
      module: "Poisson2.Padding"
