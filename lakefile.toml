name = "poisson2"
version = "0.1.0"
defaultTargets = ["Poisson2", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false
weak.linter.mathlibStandardSet = true
# The files copied from Formal Conjectures keep its Apache 2.0 header, which is not in
# Mathlib's header format.
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "5e0c4e5239cb0a2d86d68a884bf52cfd963fce22"

[[lean_lib]]
name = "Poisson2"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
